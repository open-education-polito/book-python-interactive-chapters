name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: open-education-polito/python-interactive-book-template
          path: book

      - name: Checkout chapters
        uses: actions/checkout@v4
        with:
          path: book/_sources

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: book/requirements.txt

      - name: Install dependencies
        run: pip install -r book/requirements.txt

      - name: Build
        working-directory: book
        run: runestone build --all

      - uses: actions/upload-artifact@v4
        with:
          name: libro
          path: book/build/python-interattivo

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libro
          path: libro

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Push on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync --delete -avP -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            libro/ "$SSH_USER@$SSH_HOST:/var/www/libro/"
